<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>智能问诊系统 - 登录</title>
<style>
  :root {
    --teal: #1a7a6e; --teal-deep: #0d6e63;
    --danger: #e74c3c; --ok: #2e9e6b; --warn: #e6a23c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    background: linear-gradient(140deg, #0d6e63 0%, #1a7a6e 45%, #0a5a51 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 30px 16px;
  }
  .head { text-align: center; color: #fff; margin-bottom: 26px; }
  .head h1 { font-size: 28px; letter-spacing: 3px; }
  .head p { font-size: 14px; opacity: .82; margin-top: 8px; letter-spacing: 2px; }

  .card {
    width: 100%; max-width: 400px;
    background: rgba(255, 255, 255, .10);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 16px;
    box-shadow: 0 12px 36px rgba(0, 0, 0, .25);
    padding: 30px 28px 24px;
  }
  .field { margin-bottom: 18px; }
  .field label { display: block; color: rgba(255,255,255,.85); font-size: 13px; margin-bottom: 7px; }
  .field input {
    width: 100%; padding: 11px 13px; font-size: 14px; color: #fff;
    background: rgba(0, 0, 0, .30);
    border: 1px solid rgba(255,255,255,.22); border-radius: 9px; outline: none;
    transition: border-color .2s, box-shadow .2s, background .2s;
  }
  .field input::placeholder { color: rgba(255,255,255,.42); }
  .field input:focus { border-color: #7fe3d2; background: rgba(0,0,0,.38); box-shadow: 0 0 0 3px rgba(127,227,210,.18); }
  .field input.invalid { border-color: #ff8d80; box-shadow: 0 0 0 3px rgba(231,77,60,.18); }
  .err { display: none; color: #ffb4ab; font-size: 12px; margin-top: 6px; }
  .err.show { display: block; }

  .btn {
    width: 100%; padding: 12px 0; border: none; border-radius: 10px;
    background: linear-gradient(135deg, #2ea08f, #1a7a6e); color: #fff;
    font-size: 15px; font-weight: 700; letter-spacing: 2px; cursor: pointer;
    transition: filter .2s, box-shadow .2s, opacity .2s;
    display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px;
  }
  .btn:hover:not(:disabled) { filter: brightness(1.12); box-shadow: 0 6px 16px rgba(0,0,0,.28); }
  .btn:disabled { opacity: .65; cursor: not-allowed; }
  .spin {
    display: none; width: 15px; height: 15px; border: 2.5px solid rgba(255,255,255,.4);
    border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite;
  }
  .btn.loading .spin { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .switch-line { text-align: center; margin-top: 16px; font-size: 13px; color: rgba(255,255,255,.65); }
  .switch-line a { color: #7fe3d2; font-weight: 700; cursor: pointer; text-decoration: none; }
  .switch-line a:hover { text-decoration: underline; }
  .footer { margin-top: 22px; color: rgba(255,255,255,.55); font-size: 12px; }

  #toast-wrap { position: fixed; top: 24px; left: 50%; transform: translateX(-50%); z-index: 999;
    display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .toast { padding: 11px 24px; border-radius: 10px; font-size: 14px; color: #fff;
    box-shadow: 0 6px 18px rgba(0,0,0,.3); animation: pop .25s ease; }
  .toast.error { background: var(--danger); } .toast.ok { background: var(--ok); } .toast.warn { background: var(--warn); }
  @keyframes pop { from { opacity: 0; transform: translateY(-8px);} to { opacity: 1; transform: none;} }
</style>
</head>
<body>

  <div class="head">
    <h1>智能问诊系统</h1>
    <p>登录</p>
  </div>

  <div class="card">
    <div class="field">
      <label>用户名</label>
      <input id="loginUser" placeholder="请输入用户名" autocomplete="off">
      <div class="err" id="loginUserErr">请输入用户名</div>
    </div>
    <div class="field">
      <label>密码</label>
      <input id="loginPass" type="password" placeholder="请输入密码" autocomplete="off">
      <div class="err" id="loginPassErr">请输入密码</div>
    </div>
    <button class="btn" id="btnLogin"><span class="spin"></span><span>登 录</span></button>
    <div class="switch-line">没有账号？<a id="gotoRegister">去注册</a></div>
  </div>

  <div class="footer">智能问诊系统 v1.0 | 仅供健康咨询使用，不替代专业医疗建议</div>
  <div id="toast-wrap"></div>

<script>
"use strict";
/* ===== 登录态约定（V2.0，对接后端 A2，API设计文档 2.3）=====
 * 登录成功：localStorage.clinic_token = X-Token 凭证；clinic_auth = {username} 供守卫与展示
 * 演示账号 admin/123456 由后端首次启动播种（auth_service.seed_demo_admin），不再使用本地假数据 */
const API_BASE = "http://127.0.0.1:8000";

function toast(msg, type) {
  const t = document.createElement('div');
  t.className = 'toast ' + (type || 'ok'); t.textContent = msg;
  document.getElementById('toast-wrap').appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; }, 2200);
  setTimeout(() => t.remove(), 2600);
}

document.getElementById('gotoRegister').addEventListener('click', () => location.href = 'register.html');

function setErr(inputId, errId, msg) {
  const input = document.getElementById(inputId), err = document.getElementById(errId);
  if (msg) { input.classList.add('invalid'); err.classList.add('show'); return false; }
  input.classList.remove('invalid'); err.classList.remove('show'); return true;
}

/* 记住上次登录的用户名，回填输入框 */
const last = localStorage.getItem('clinic_last_user');
if (last) document.getElementById('loginUser').value = last;

document.getElementById('loginUser').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
document.getElementById('loginPass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
document.getElementById('btnLogin').addEventListener('click', doLogin);

async function doLogin() {
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  // 前端必填校验：空值提示且不发起登录（《用户登录功能需求.md》异常场景）
  const ok = setErr('loginUser', 'loginUserErr', u ? '' : '请输入用户名');
  setErr('loginPass', 'loginPassErr', p ? '' : '请输入密码');
  if (!ok || !p) return;

  const btn = document.getElementById('btnLogin');
  btn.classList.add('loading'); btn.disabled = true;
  try {
    const resp = await fetch(API_BASE + '/api/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u, password: p }),
    });
    const body = await resp.json();
    if (body.code !== 0) throw { message: body.message };     // 4410 统一"用户名或密码错误"（防枚举）
    localStorage.setItem('clinic_token', body.data.token);
    localStorage.setItem('clinic_auth', JSON.stringify({ username: body.data.username, time: Date.now() }));
    localStorage.setItem('clinic_last_user', body.data.username);
    toast('登录成功，正在进入主页面…', 'ok');
    setTimeout(() => location.href = 'index.html', 600);      // 匹配成功 → 主页面
  } catch (e) {
    toast(e.message && e.message.includes ? (e.message.includes('Failed to fetch') ? '服务暂时不可用，请稍后重试' : e.message) : '服务暂时不可用，请稍后重试', 'error');
  } finally {
    btn.classList.remove('loading'); btn.disabled = false;
  }
}
</script>
</body>
</html>
