<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>智能问诊系统</title>
<style>
  :root {
    --teal: #1a7a6e;
    --teal-deep: #0d6e63;
    --teal-light: #e6f4f1;
    --purple: #6c5ce7;
    --bg: #eef2f1;
    --warn-bg: #fff8dd;
    --warn-border: #f0d878;
    --danger: #e74c3c;
    --ok: #27ae60;
    --text: #2d3b38;
    --text-sub: #7a8a86;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-width: 1024px;
  }
  .app {
    max-width: 1080px; margin: 0 auto; padding: 16px 16px 8px;
    display: flex; flex-direction: column;
    height: 100vh; height: 100dvh;
  }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #b0b0b0; }
  ::-webkit-scrollbar-track { background: transparent; }

  .banner {
    background: linear-gradient(135deg, var(--teal) 0%, var(--teal-deep) 60%, #0a5a51 100%);
    border-radius: 16px; padding: 24px 20px 20px; text-align: center; color: #fff;
    box-shadow: 0 6px 18px rgba(13, 110, 99, .18); margin-bottom: 16px; flex-shrink: 0;
  }
  .banner h1 { font-size: 25px; letter-spacing: 2px; }
  .banner p { font-size: 13px; opacity: .85; margin-top: 7px; letter-spacing: 1px; }
  /* 登录用户栏 */
  .banner { position: relative; }
  .user-bar { position: absolute; right: 18px; top: 50%; transform: translateY(-50%);
              display: flex; align-items: center; gap: 10px; font-size: 13px; }
  .user-bar .who { color: rgba(255,255,255,.85); }
  .user-bar .who b { color: #fff; }
  .btn-logout { background: rgba(255,255,255,.18); border: none; color: #fff; font-size: 12.5px;
                padding: 5px 12px; border-radius: 8px; cursor: pointer; transition: background .2s, box-shadow .2s; }
  .btn-logout:hover { background: rgba(255,255,255,.32); box-shadow: 0 2px 6px rgba(0,0,0,.15); }

  .main {
    display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr);
    gap: 18px; align-items: stretch; flex: 1; min-height: 0;
  }
  .card { background: #fff; border-radius: 14px; box-shadow: 0 3px 12px rgba(45, 80, 75, .08);
          overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
  .card-header { padding: 13px 16px; color: #fff; font-weight: 700; font-size: 15px;
                 display: flex; align-items: center; justify-content: space-between; }
  .chat-header { background: var(--teal); }
  .report-header { background: var(--purple); }

  .btn-clear { background: rgba(255,255,255,.18); border: none; color: #fff; font-size: 13px;
    padding: 5px 12px; border-radius: 8px; cursor: pointer; transition: background .2s, box-shadow .2s; }
  .btn-clear:hover { background: rgba(255,255,255,.32); box-shadow: 0 2px 6px rgba(0,0,0,.15); }

  .chat-box { flex: 1; min-height: 0; overflow-y: auto; padding: 18px 16px; background: #fbfdfc; }
  .msg { display: flex; margin-bottom: 16px; }
  .msg.user { justify-content: flex-end; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; flex: none; margin-right: 10px;
    background: var(--teal-light); display: flex; align-items: center; justify-content: center; font-size: 18px;
    box-shadow: 0 1px 4px rgba(26,122,110,.15); }
  .bubble-ai { background: var(--teal-light); border: 1px solid #d5ebe6; border-radius: 4px 12px 12px 12px;
    padding: 12px 14px; max-width: 78%; font-size: 14px; line-height: 1.7; }
  .bubble-user { background: var(--teal); color: #fff; border-radius: 12px 4px 12px 12px;
    padding: 10px 14px; max-width: 70%; font-size: 14px; line-height: 1.6;
    box-shadow: 0 2px 6px rgba(26,122,110,.25); white-space: pre-wrap; word-break: break-word; }
  .tip-bar { margin-top: 10px; background: var(--warn-bg); border: 1px solid var(--warn-border);
    border-radius: 8px; padding: 8px 10px; font-size: 12.5px; color: #8a6d1a; line-height: 1.6; }
  .md-block p { margin: 4px 0; }
  .md-h { font-weight: 700; color: var(--teal-deep); margin: 10px 0 4px; font-size: 14px; }
  .md-block ul { margin: 4px 0 6px; padding-left: 2px; list-style: none; }
  .md-block li { padding-left: 16px; position: relative; margin: 3px 0; }
  .md-block li::before { content: "●"; color: var(--teal); position: absolute; left: 2px; font-size: 10px; top: 4px; }
  .caret { display: inline-block; width: 2px; height: 14px; background: var(--teal); vertical-align: -2px; animation: blink .6s infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .dots span { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--teal); margin: 0 2px; animation: jump 1s infinite; }
  .dots span:nth-child(2) { animation-delay: .18s; } .dots span:nth-child(3) { animation-delay: .36s; }
  @keyframes jump { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-5px); } }

  .input-area { border-top: 1px solid #e8efed; padding: 12px; display: flex; gap: 10px; background: #fff; flex-shrink: 0; }
  .input-area textarea { flex: 1; resize: none; height: 52px; border: 1px solid #d7e3e0; border-radius: 10px;
    padding: 10px 12px; font-size: 14px; font-family: inherit; outline: none; transition: border-color .2s, box-shadow .2s; background: #fbfdfc; }
  .input-area textarea:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(26,122,110,.12); }
  .btn-send { flex: none; background: var(--teal); color: #fff; border: none; border-radius: 10px;
    padding: 0 22px; font-size: 14px; font-weight: 700; cursor: pointer; transition: background .2s, box-shadow .2s, opacity .2s; }
  .btn-send:hover:not(:disabled) { background: var(--teal-deep); box-shadow: 0 3px 8px rgba(26,122,110,.35); }
  .btn-send:disabled { opacity: .55; cursor: not-allowed; }

  .report-body { padding: 16px; flex: 1; min-height: 0; display: flex; flex-direction: column; overflow-y: auto; }
  .upload-zone { border: 2px dashed #b9c7c4; border-radius: 14px; background: #f8fbfa;
    padding: 34px 16px; text-align: center; cursor: pointer; transition: border-color .2s, background .2s, box-shadow .2s; }
  .upload-zone:hover { border-color: var(--teal); box-shadow: 0 2px 10px rgba(26,122,110,.10); }
  .upload-zone.dragover { border-color: var(--teal); background: var(--teal-light); }
  .upload-zone .icon { font-size: 38px; color: #f5b942; }
  .upload-zone .lead { font-size: 14px; font-weight: 700; margin-top: 10px; }
  .upload-zone .sub { font-size: 12px; color: var(--text-sub); margin-top: 6px; }
  .btn-pick { margin-top: 14px; background: var(--teal); color: #fff; border: none; border-radius: 9px;
    padding: 8px 22px; font-size: 13.5px; font-weight: 700; cursor: pointer; transition: background .2s, box-shadow .2s, opacity .2s; }
  .btn-pick:hover:not(:disabled) { background: var(--teal-deep); box-shadow: 0 3px 8px rgba(26,122,110,.3); }
  .btn-pick:disabled { opacity: .55; cursor: not-allowed; }
  .file-card { display: none; margin-top: 12px; background: var(--teal-light); border: 1px solid #d5ebe6;
    border-radius: 10px; padding: 10px 12px; font-size: 13px; align-items: center; gap: 8px; word-break: break-all; }
  .file-card .size { color: var(--text-sub); font-size: 12px; }

  .analyzing { display: none; text-align: center; padding: 46px 0; }
  .spinner { width: 40px; height: 40px; border: 4px solid #d5ebe6; border-top-color: var(--teal);
    border-radius: 50%; margin: 0 auto 14px; animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .analyzing p { font-size: 13.5px; color: var(--teal-deep); font-weight: 600; }

  .result { display: none; }
  .result h4 { font-size: 13.5px; color: var(--purple); margin: 14px 0 6px; }
  .result h4:first-child { margin-top: 0; }
  .critical-bar { display: none; background: #fdecea; border: 1.5px solid var(--danger); color: var(--danger);
    border-radius: 10px; padding: 10px 12px; font-size: 13px; font-weight: 700; margin-bottom: 10px; }
  .base-info { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; font-size: 12.5px;
    background: #f8f7fd; border-radius: 10px; padding: 10px 12px; }
  .base-info b { color: var(--text-sub); font-weight: 600; }
  .abn-item { border: 1px solid #eae4fb; background: #faf9fe; border-radius: 10px; padding: 10px 12px;
    font-size: 12.5px; margin-bottom: 8px; }
  .abn-top { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  .abn-name { font-weight: 700; font-size: 13px; }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: 999px; font-weight: 700; white-space: nowrap; }
  .tag.high { background: #fdecea; color: var(--danger); }
  .tag.low  { background: #fff3e0; color: #e67e22; }
  .abn-vals { color: var(--text-sub); margin-top: 4px; }
  .abn-adv { margin-top: 5px; line-height: 1.6; }
  .abn-adv::before { content: "改进方案："; color: var(--purple); font-weight: 700; }
  .result .para { font-size: 12.5px; line-height: 1.7; }
  .result .warn-note { background: var(--warn-bg); border: 1px solid var(--warn-border); border-radius: 8px;
    padding: 8px 10px; font-size: 12px; color: #8a6d1a; line-height: 1.6; margin-top: 6px; }
  .btn-row { display: flex; gap: 10px; margin-top: 16px; }
  .btn-dl, .btn-re { flex: 1; border: none; border-radius: 9px; padding: 9px 0; font-size: 13px;
    font-weight: 700; cursor: pointer; transition: background .2s, box-shadow .2s; }
  .btn-dl { background: var(--purple); color: #fff; }
  .btn-dl:hover { background: #5a4bd1; box-shadow: 0 3px 8px rgba(108,92,231,.35); }
  .btn-re { background: #fff; color: var(--purple); border: 1.5px solid var(--purple); }
  .btn-re:hover { background: #f3f1fd; box-shadow: 0 2px 6px rgba(108,92,231,.2); }

  .footer { text-align: center; color: #93a19d; font-size: 12px; padding: 10px 0 4px; flex-shrink: 0; }

  #toast-wrap { position: fixed; top: 24px; left: 50%; transform: translateX(-50%); z-index: 999;
    display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .toast { padding: 10px 22px; border-radius: 10px; font-size: 13.5px; color: #fff;
    box-shadow: 0 6px 18px rgba(0,0,0,.18); animation: pop .25s ease; max-width: 520px; }
  .toast.error { background: var(--danger); }
  .toast.warn { background: #e6a23c; }
  .toast.ok { background: var(--ok); }
  @keyframes pop { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
  .shake { animation: shake .3s; }
  @keyframes shake { 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }
</style>
</head>
<body>
<div class="app">

  <header class="banner">
    <h1>智能问诊系统</h1>
    <p>AI驱动的健康问答与体检报告分析服务</p>
    <div class="user-bar">
      <span class="who">👤 <b id="curUser">--</b></span>
      <button class="btn-logout" id="btnHistory">🗂 历史记录</button>
      <button class="btn-logout" id="btnLogout">退出登录</button>
    </div>
  </header>

  <div class="main">
    <section class="card">
      <div class="card-header chat-header">
        <span>💬 健康咨询</span>
        <button class="btn-clear" id="btnClear">🗑 清空</button>
      </div>
      <div class="chat-box" id="chatBox"></div>
      <div class="input-area">
        <textarea id="chatInput" placeholder="输入您的健康问题，按Enter发送，Shift+Enter换行…"></textarea>
        <button class="btn-send" id="btnSend">发送 ➤</button>
      </div>
    </section>

    <aside class="card">
      <div class="card-header report-header"><span>📋 体检报告分析</span></div>
      <div class="report-body">
        <div class="upload-zone" id="uploadZone">
          <div class="icon">📁</div>
          <div class="lead">点击或拖拽PDF文件到此处</div>
          <div class="sub">仅支持PDF格式，大小不超过10MB</div>
          <button class="btn-pick" id="btnPick">选择文件</button>
          <input type="file" id="fileInput" accept=".pdf,application/pdf" hidden>
        </div>
        <div class="file-card" id="fileCard">
          <span>📄</span><span id="fileName"></span><span class="size" id="fileSize"></span>
        </div>
        <div class="analyzing" id="analyzing">
          <div class="spinner"></div>
          <p>AI正在分析体检报告，请稍候…</p>
        </div>
        <div class="critical-bar" id="criticalBar">🚨 检测到严重异常指标，建议尽快就医！</div>
        <div class="result" id="result"></div>
      </div>
    </aside>
  </div>

  <footer class="footer">智能问诊系统 v1.0 | 仅供健康咨询使用，不替代专业医疗建议</footer>
</div>

<div id="toast-wrap"></div>

<script>
"use strict";
/* ==================== 登录守卫（mock 阶段，接后端 A2/A3 后改为 X-Token） ==================== */
const auth = (() => {
  try { return JSON.parse(localStorage.getItem('clinic_auth') || 'null'); } catch (e) { return null; }
})();
if (!auth || !auth.username || !localStorage.getItem('clinic_token')) {
  location.replace('login.html');                                  // 未登录/无凭证 → 强制跳登录页
}
document.getElementById('curUser').textContent = (auth && auth.username) || '未登录';

document.getElementById('btnHistory').addEventListener('click', () => location.href = 'history.html');

/* 登录态失效（4411）统一处理：清本地凭证回登录页 */
function forceRelogin() {
  localStorage.removeItem('clinic_auth');
  localStorage.removeItem('clinic_token');
  location.replace('login.html');
}

/* 退出登录：后端作废旧 Token + 清本地登录态回登录页（FR-17，API文档 2.4） */
document.getElementById('btnLogout').addEventListener('click', async () => {
  if (!confirm('确定退出登录吗？')) return;
  try { await fetch(API_BASE + '/api/logout', { method: 'POST', headers: { 'X-Token': TOKEN } }); }
  catch (e) { /* 后端不可达也继续本地登出（幂等语义） */ }
  forceRelogin();
});

/* ==================== 后端对接配置 ==================== */
const API_BASE = "http://127.0.0.1:8000";

/* 登录凭证：X-Token（API 文档 1.1 V2.0，由后端 /api/login 颁发，auth_token 表校验） */
const TOKEN = localStorage.getItem("clinic_token") || "";

function toast(msg, type) {
  const el = document.createElement('div');
  el.className = 'toast ' + (type || 'ok');
  el.textContent = msg;
  document.getElementById('toast-wrap').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; }, 2800);
  setTimeout(() => el.remove(), 3200);
}

/* 统一 API 请求：解析 {code,message,data}，非 0 抛出（message 即可展示文案） */
async function api(path, options = {}) {
  const resp = await fetch(API_BASE + path, {
    ...options,
    headers: { 'X-Token': TOKEN, ...(options.headers || {}) },
  });
  if (!resp.ok && resp.status >= 500) throw { code: 5000, message: '服务暂时不可用，请稍后重试' };
  const body = await resp.json();
  if (body.code === 4411) {                          // 登录态失效：清本地凭证回登录页（API文档 1.3）
    localStorage.removeItem('clinic_auth'); localStorage.removeItem('clinic_token');
    location.replace('login.html'); throw { code: 4411, message: body.message };
  }
  if (body.code !== 0) throw { code: body.code, message: body.message };
  return body.data;
}

function el(html) {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstChild;
}

/* 行式 Markdown 渲染：### 标题、- 列表、**加粗**（逐行解析，流式无半截标签） */
function renderMarkdown(text) {
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const inline = s => esc(s).replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  let html = '', inList = false;
  for (const line of text.split('\n')) {
    if (/^###\s+/.test(line)) {
      if (inList) { html += '</ul>'; inList = false; }
      html += '<div class="md-h">' + inline(line.replace(/^###\s+/, '')) + '</div>';
    } else if (/^[-•●]\s*/.test(line)) {
      if (!inList) { html += '<ul>'; inList = true; }
      html += '<li>' + inline(line.replace(/^[-•●]\s*/, '')) + '</li>';
    } else if (line.trim() === '') {
      if (inList) { html += '</ul>'; inList = false; }
    } else {
      if (inList) { html += '</ul>'; inList = false; }
      html += '<p>' + inline(line) + '</p>';
    }
  }
  if (inList) html += '</ul>';
  return html;
}

/* ==================== 健康咨询（SSE 流式） ==================== */
const chatBox = document.getElementById('chatBox');
const chatInput = document.getElementById('chatInput');
const btnSend = document.getElementById('btnSend');
const btnClear = document.getElementById('btnClear');
let streaming = false;
/* 会话恢复（同 tab 内跳转 history 返回不丢；tab 关闭 sessionStorage 自动清空 → 重开为全新对话） */
const CONV_KEY = 'clinic_active_conv';
let conversationId = Number(sessionStorage.getItem(CONV_KEY)) || null;

const WELCOME_TEXT = '您好！我是您的AI健康助手。我可以帮您：\n- 解答常见健康问题\n- 分析体检报告中的异常项\n- 提供专业改进建议';

function appendWelcome() {
  const m = el(`<div class="msg ai"><div class="avatar">🤖</div>
    <div><div class="bubble-ai"><div class="md-block">${renderMarkdown(WELCOME_TEXT)}</div>
    <div class="tip-bar">⚠️ 温馨提示：AI建议仅供参考，如有疑虑请咨询专业医生。</div></div></div></div>`);
  chatBox.appendChild(m);
  scrollBottom(true);
}

function scrollBottom(force) {
  const nearBottom = chatBox.scrollHeight - chatBox.scrollTop - chatBox.clientHeight < 120;
  if (force || nearBottom) chatBox.scrollTop = chatBox.scrollHeight;
}

function appendUserMsg(text) {
  const m = el(`<div class="msg user"><div class="bubble-user"></div></div>`);
  m.querySelector('.bubble-user').textContent = text;
  chatBox.appendChild(m);
  scrollBottom(true);
}

function appendThinking() {
  const m = el(`<div class="msg ai"><div class="avatar">🤖</div>
    <div><div class="bubble-ai"><span class="dots"><span></span><span></span><span></span></span> 正在思考…</div></div></div>`);
  chatBox.appendChild(m);
  scrollBottom(true);
  return m;
}

function appendAiBubble() {
  const m = el(`<div class="msg ai"><div class="avatar">🤖</div>
    <div><div class="bubble-ai"><div class="md-block"></div>
    <div class="tip-bar">⚠️ 温馨提示：AI建议仅供参考，如有疑虑请咨询专业医生。</div></div></div></div>`);
  chatBox.appendChild(m);
  scrollBottom(true);
  return m.querySelector('.md-block');
}

function setSendState(busy) {
  streaming = busy;
  btnSend.disabled = busy;
  btnSend.textContent = busy ? '回复中…' : '发送 ➤';
}

/* 解析 SSE：按空行分块，回调 event/data */
function makeSSEParser(onEvent) {
  let buf = '';
  return chunk => {
    buf += chunk;
    let idx;
    while ((idx = buf.indexOf('\n\n')) >= 0) {
      const block = buf.slice(0, idx);
      buf = buf.slice(idx + 2);
      let event = 'message', data = '';
      for (const line of block.split('\n')) {
        if (line.startsWith('event:')) event = line.slice(6).trim();
        else if (line.startsWith('data:')) data += line.slice(5).trim();
      }
      if (data) { try { onEvent(event, JSON.parse(data)); } catch (e) { /* 忽略坏帧 */ } }
    }
  };
}

async function sendMessage() {
  if (streaming) return;
  const raw = chatInput.value;
  if (!raw.trim()) {                                   // C-E1：拒绝并聚焦
    toast('请先输入您的健康问题', 'warn');
    chatInput.focus();
    chatInput.classList.add('shake');
    setTimeout(() => chatInput.classList.remove('shake'), 350);
    return;
  }
  if (raw.length > 2000) { toast('输入内容超过 2000 字符，请精简后发送', 'error'); chatInput.focus(); return; }  // C-E2

  const content = raw.trim();
  appendUserMsg(content);
  chatInput.value = '';
  setSendState(true);
  const thinking = appendThinking();
  let bodyEl = null, acc = '';

  try {
    const resp = await fetch(API_BASE + '/api/chat', {
      method: 'POST',
      headers: { 'X-Token': TOKEN, 'Content-Type': 'application/json' },
      body: JSON.stringify({ content, conversation_id: conversationId }),
    });
    const ct = resp.headers.get('content-type') || '';
    if (!ct.includes('text/event-stream')) {           // 4001/4002/4411 等非流式错误
      const body = await resp.json();
      if (body.code === 4411) { forceRelogin(); return; }
      throw { code: body.code, message: body.message };
    }
    const parse = makeSSEParser((event, data) => {
      if (event === 'start') {
        conversationId = data.conversation_id;
        sessionStorage.setItem(CONV_KEY, String(conversationId));   // 持久会话指针，供返回主页时恢复
        thinking.remove(); bodyEl = appendAiBubble();
      }
      else if (event === 'token') { acc += data.text; bodyEl.innerHTML = renderMarkdown(acc) + '<span class="caret"></span>'; scrollBottom(); }
      else if (event === 'done') { /* 正常结束 */ }
      else if (event === 'error') { throw { code: data.code, message: data.message }; }
    });
    const reader = resp.body.getReader();
    const decoder = new TextDecoder('utf-8');
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      parse(decoder.decode(value, { stream: true }));
    }
    if (bodyEl) bodyEl.innerHTML = renderMarkdown(acc);  // 去掉光标
    scrollBottom();
  } catch (e) {
    const msg = (e && e.message) || '服务暂时不可用，请稍后重试';
    if (bodyEl) {                                       // C-E4：保留已返回部分
      bodyEl.innerHTML = renderMarkdown(acc) + '<div class="tip-bar">⚠️ ' + msg + '（点击重新发送）</div>';
    } else {
      thinking.remove();
      toast(msg, 'error');
    }
    scrollBottom(true);
  } finally {
    setSendState(false);
  }
}

btnSend.addEventListener('click', sendMessage);
chatInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
btnClear.addEventListener('click', async () => {
  if (streaming) { toast('AI 正在回复中，请稍后再清空', 'warn'); return; }
  if (!confirm('确定要清空当前对话吗？清空后无法恢复。')) return;   // C-E9 二次确认
  if (conversationId) {
    try { await api('/api/conversations/' + conversationId, { method: 'DELETE' }); }
    catch (e) { /* 记录已不在不影响本地重置 */ }
    conversationId = null;                              // C-BR-06：上下文同步重置
    sessionStorage.removeItem(CONV_KEY);
  }
  chatBox.innerHTML = '';
  appendWelcome();
  chatInput.value = '';
  toast('对话已清空');
});

/* ==================== 体检报告分析（上传 + 轮询） ==================== */
const uploadZone = document.getElementById('uploadZone');
const btnPick = document.getElementById('btnPick');
const fileInput = document.getElementById('fileInput');
const fileCard = document.getElementById('fileCard');
const analyzing = document.getElementById('analyzing');
const criticalBar = document.getElementById('criticalBar');
const resultBox = document.getElementById('result');
let analyzingFlag = false;
let currentReportId = null;

function fmtSize(bytes) {
  return bytes < 1024 * 1024 ? (bytes / 1024).toFixed(1) + ' KB' : (bytes / 1024 / 1024).toFixed(2) + ' MB';
}

function validateFileFront(file) {                     // 前端即时校验（后端兜底文案一致）
  if (!/\.pdf$/i.test(file.name) || (file.type && file.type !== 'application/pdf')) return '仅支持 PDF 格式';
  if (file.size === 0) return '文件无效，请重新选择';
  if (file.size > 10 * 1024 * 1024) return '文件大小不能超过 10MB';
  return null;
}

function switchPanel(stage) {
  uploadZone.style.display  = stage === 'upload'    ? 'block' : 'none';
  analyzing.style.display   = stage === 'analyzing' ? 'block' : 'none';
  resultBox.style.display   = stage === 'result'    ? 'block' : 'none';
}

async function handleFile(file) {
  if (analyzingFlag) { toast('报告解析中，请勿重复提交', 'warn'); return; }   // R-E7
  const err = validateFileFront(file);
  if (err) {
    toast(err, 'error');
    uploadZone.classList.add('shake');
    setTimeout(() => uploadZone.classList.remove('shake'), 350);
    return;
  }
  document.getElementById('fileName').textContent = file.name;
  document.getElementById('fileSize').textContent = fmtSize(file.size);
  fileCard.style.display = 'flex';

  analyzingFlag = true;
  btnPick.disabled = true;
  uploadZone.style.pointerEvents = 'none';
  uploadZone.style.opacity = '.45';

  try {
    const fd = new FormData();
    fd.append('file', file);
    const data = await api('/api/report/upload', { method: 'POST', body: fd });
    currentReportId = data.report_id;
    switchPanel('analyzing');
    await pollReport(currentReportId);
  } catch (e) {
    toast(e.message || '报告解析失败，请重试', 'error');
    reanalyze(false);                                  // 失败恢复上传初始态（R-E4/BR-07）
  } finally {
    if (analyzingFlag) { analyzingFlag = false; btnPick.disabled = false;
      uploadZone.style.pointerEvents = ''; uploadZone.style.opacity = ''; }
  }
}

async function pollReport(id, timeoutMs = 120000, intervalMs = 2000) {
  const t0 = Date.now();
  for (;;) {
    const d = await api('/api/report/' + id);
    if (d.status === 'success') {
      renderResult(d);
      switchPanel('result');
      analyzingFlag = false;
      btnPick.disabled = false; uploadZone.style.pointerEvents = ''; uploadZone.style.opacity = '';
      toast('体检报告分析完成');
      return;
    }
    if (d.status === 'failed') {
      toast(d.message || '报告解析失败，请重试', 'error');
      reanalyze(false);
      return;
    }
    if (Date.now() - t0 > timeoutMs) {                 // 120s 超时（PRD 性能）
      toast('服务响应超时，请稍后重试', 'error');
      reanalyze(false);
      return;
    }
    await new Promise(r => setTimeout(r, intervalMs));
  }
}

function renderResult(d) {
  const r = d.result;
  const bi = r.basic_info;
  let html = '<h4>📌 基本信息</h4><div class="base-info">' +
    `<div><b>姓名：</b>${bi.name || '—'}</div><div><b>性别：</b>${bi.gender || '—'}</div>` +
    `<div><b>年龄：</b>${bi.age || '—'}</div><div><b>体检日期：</b>${bi.report_date || '—'}</div>` +
    `<div style="grid-column:1/-1"><b>体检机构：</b>${bi.org || '—'}</div></div>` +
    '<h4>⚠️ 异常项明细</h4>';
  if (!r.abnormal_items.length) html += '<div class="para">未检出明显异常指标。</div>';
  for (const a of r.abnormal_items) {
    html += `<div class="abn-item">
      <div class="abn-top"><span class="abn-name">${a.name}${a.critical ? ' 🚨' : ''}</span>
      <span class="tag ${a.status}">${a.label}</span></div>
      <div class="abn-vals">检测值：${a.value} ｜ 参考范围：${a.ref}</div>
      <div class="abn-adv">${a.advice}</div></div>`;
  }
  html += `<h4>💡 总体健康建议</h4><div class="para">${renderMarkdown(r.overall_advice)}</div>
           <h4>📋 注意事项</h4><div class="warn-note">${r.precautions}</div>
           <div class="btn-row">
             <button class="btn-dl" id="btnDownload">⬇ 下载报告</button>
             <button class="btn-re" id="btnReanalyze">🔄 重新分析</button>
           </div>`;
  resultBox.innerHTML = html;
  criticalBar.style.display = d.has_critical ? 'block' : 'none';   // BR-10/E9
  document.getElementById('btnDownload').addEventListener('click', downloadReport);
  document.getElementById('btnReanalyze').addEventListener('click', () => reanalyze(true));
}

async function downloadReport() {
  try {
    const resp = await fetch(`${API_BASE}/api/report/${currentReportId}/download`,
                             { headers: { 'X-Token': TOKEN } });
    const body = await resp.json().then(b => b).catch(() => null);   // 成功时是文本流
    if (resp.headers.get('content-type')?.includes('application/json')) {
      throw { message: (body && body.message) || '下载失败，请重试' };
    }
    const text = await resp.text();
    const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '体检报告分析结果.txt';
    a.click();
    URL.revokeObjectURL(a.href);
    toast('报告已开始下载');
  } catch (e) {
    toast(e.message || '下载失败，请重试', 'error');                 // R-E8 允许重试
  }
}

function reanalyze(showToast) {
  resultBox.innerHTML = '';
  resultBox.style.display = 'none';
  analyzing.style.display = 'none';
  criticalBar.style.display = 'none';
  fileCard.style.display = 'none';
  fileInput.value = '';
  currentReportId = null;
  analyzingFlag = false;
  btnPick.disabled = false;
  uploadZone.style.pointerEvents = '';
  uploadZone.style.opacity = '';
  switchPanel('upload');
  if (showToast) toast('已重置，请上传新的体检报告');
}

/* 上传交互：点击 / 按钮 / 拖拽 */
btnPick.addEventListener('click', e => { e.stopPropagation(); if (!analyzingFlag) fileInput.click(); });
uploadZone.addEventListener('click', () => { if (!analyzingFlag) fileInput.click(); });
fileInput.addEventListener('change', () => {
  const f = fileInput.files[0];
  if (f) handleFile(f);
  fileInput.value = '';                 // 复位，允许再次选择同一文件重试
});
uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('dragover'); });
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
uploadZone.addEventListener('drop', e => {
  e.preventDefault();
  uploadZone.classList.remove('dragover');
  const f = e.dataTransfer.files[0];
  if (f) handleFile(f);
});
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => e.preventDefault());

/* 初始化：有会话指针则恢复当前对话（同 tab 从历史页返回场景），否则显示欢迎语。
 * tab 关闭后 sessionStorage 自动清空 → 重开页面为全新对话，旧会话保留在历史记录中 */
async function restoreConversation() {
  if (!conversationId) { appendWelcome(); return; }
  try {
    const d = await api('/api/conversations/' + conversationId);
    for (const m of d.messages) {
      if (m.role === 'user') appendUserMsg(m.content);
      else appendAiBubble().innerHTML = renderMarkdown(m.content);
    }
    scrollBottom(true);
  } catch (e) {                       // 会话已被删除（4302）或后端不可达：回退欢迎语
    conversationId = null;
    sessionStorage.removeItem(CONV_KEY);
    appendWelcome();
  }
}
restoreConversation();
</script>
